[project]
name = "aiqms"
version = "0.1.0"
description = "AI-QMS — AI-first electronic Quality Management System"
requires-python = ">=3.12"
dependencies = [
    # psycopg 3 with prepare_threshold=None is mandated by RESEARCH-SLICES.md §1/§4:
    # Supavisor transaction mode does not support named prepared statements.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiqms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/aiqms"]
