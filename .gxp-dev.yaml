# .gxp-dev.yaml — consumer manifest (generated by /gdd.init on 2026-07-27)

# Toolkit version constraint.
# Standalone layout: the toolkit is NOT vendored in this repository. Provenance pin for
# the artifacts produced here — gxp-driven-dev @ commit dd91827
# (github.com/aristo-Cat/gxp-driven-dev). Move the pin deliberately, never silently.
gxp_dev_version: ">=0.1.0,<1.0.0"

# Identity
project_id: "AIQMS-2026-001"
project_name: "AI-QMS — AI-first electronic Quality Management System"
language: en

# Mode
mode: develop

# Lifecycle
lifecycle: hybrid
gamp_category: 5
lifecycle_phase: project

# Profile (domain + rigor)
profile: pharma
rigor_level: regulated

# ID scheme
id_scheme: canonical

# Active presets
# NOTE: annex22_active is a declared flag only — the toolkit ships no Annex 22 preset
# requirement block and no AISC template (planned, not shipped). AI-specific requirements
# are authored explicitly in the URS; see STATE.md "Known toolkit gaps".
presets:
  part11_active: true
  annex11_active: true
  gdpr_active: true
  annex22_active: true

# Active templates (27 — project-phase set; operation/retirement records added when
# lifecycle_phase moves to `operation`: PR, CC, IR, DECOM-PLAN. VMP excluded: program-level,
# redundant with VP for a single system. CS excluded: Cat 4 configured-product artifact.
# AISC not listed: template does not exist in templates/csv/.)
templates_active:
  - GXP-ASSESS
  - VP
  - SUP-ASSESS
  - RA-INIT
  - URS
  - FS
  - DS
  - ADR
  - API-SPEC
  - DBS
  - UC
  - AC
  - RA-DET
  - UT-PLAN
  - IT-PLAN
  - SEC-TEST
  - PERF-TEST
  - INFRA-QUAL
  - IQ
  - OQ
  - PQ
  - CR
  - RTM
  - VR
  - RN
  - DEPLOY-RUN
  - DPIA

# Outputs
outputs:
  specs: true
  code: true
  tests: true
  compliance_bundle: true

# V2 operational harnesses. Development is the default for custom-code projects.
default_harness: development

harnesses:
  development:
    enabled: true
    lifecycle: agile
    evidence_mode: validation_ready
    max_active_work_items: 1
    tdd:
      enabled: true
      required_for_statuses: [evidence_ready, reviewed, done]
      require_red_green_refactor: true
      allow_not_applicable: false
    plan_doctor:
      enabled: true
    run_tracking:
      enabled: true
    isolation:
      enabled: false
      mode: metadata_only
    active_work_item: null
    work_items: []
    gates:
      design_options: required
      research_review: required
      implementation_review: required
      flow_evidence: when_applicable
  validation:
    enabled: true
    lifecycle: gamp5
    source: development_evidence
    active_validation_item: null
    validation_items: []
    gates:
      system_analysis: required
      gap_report: required
      rtm: required
      validation_report: required
